# Configuration Decap CMS — Mon Skyblog
# Documentation : https://decapcms.org/docs/configuration-options/
#
# En local : `npm run dev` + `npm run cms`, puis ouvrir http://localhost:4321/admin/
# (les modifications sont écrites directement dans src/content/blog/*.md).

backend:
  name: github
  # PLACEHOLDER : remplacer "owner/repo" par le dépôt GitHub réel du site.
  # À renseigner en T5 avec le proxy OAuth (voir documentation Decap « GitHub backend »).
  repo: owner/repo
  branch: main
  # PLACEHOLDER : URL du proxy OAuth (Cloudflare Worker, Netlify, etc.) à renseigner
  # en production (T5). En local, ce champ n'est pas utilisé grâce à `local_backend`.
  # base_url: https://oauth.example.com
  auth_endpoint: auth

# Écriture locale sans OAuth : decap-server (port 8081) proxifie les appels.
local_backend: true

# Interface en français.
locale: fr

# Médias : fichiers versionnés dans public/, servis depuis /images/uploads/.
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Articles
    label_singular: Article
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    # Ces champs correspondent exactement au schéma .strict() de
    # src/content/config.ts : n'en ajouter aucun sans mettre à jour le schéma Astro.
    fields:
      - name: title
        label: Titre
        widget: string
      - name: date
        label: Date de publication
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
      - name: description
        label: Description
        widget: text
      - name: author
        label: Auteur
        widget: string
        default: Le Webmaster
      - name: tags
        label: Tags
        widget: list
        default: []
        field:
          name: tag
          label: Tag
          widget: string
      - name: cover
        label: Image de couverture
        widget: image
        required: false
      - name: draft
        label: Brouillon
        widget: boolean
        default: false
      - name: body
        label: Contenu
        widget: markdown
