# Configuration Decap CMS — Mon Skyblog
# Documentation : https://decapcms.org/docs/configuration-options/
#
# En local : `npm run dev` + `npm run cms`, puis ouvrir http://localhost:4321/admin/
# (les modifications sont écrites directement dans src/content/blog/*.md).

backend:
  name: github
  # Dépôt GitHub de production et branche d'écriture (voir docs/decap-oauth.md).
  repo: CointrOH/mon-skyblog
  branch: main
  # Service OAuth de production (worker Cloudflare sveltia-cms-auth), configuré
  # le 25/11/2026. Origine seule, SANS chemin ni slash final. En local, ce champ
  # n'est pas utilisé grâce à `local_backend`. Procédure : docs/decap-oauth.md
  base_url: https://sveltia-cms-auth.sebastien-zambernardi.workers.dev
  auth_endpoint: auth
  # auth_scope n'a pas d'effet avec une GitHub App (permissions de l'app).

# Écriture locale sans OAuth : decap-server (port 8081) proxifie les appels.
local_backend: true

# Interface en français.
locale: fr

# Médias : fichiers versionnés dans public/, servis depuis /images/uploads/.
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Articles
    label_singular: Article
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    # Ces champs correspondent exactement au schéma .strict() de
    # src/content/config.ts : n'en ajouter aucun sans mettre à jour le schéma Astro.
    fields:
      - name: title
        label: Titre
        widget: string
        pattern:
          - '^.{3,}$'
          - 'Le titre doit contenir au moins 3 caractères (schéma Astro).'
      - name: date
        label: Date de publication
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
      - name: description
        label: Description
        widget: text
        hint: 'Au moins 10 caractères (contrainte du schéma Astro : le build échoue sinon).'
        pattern:
          - '^[\s\S]{10,}$'
          - 'La description doit contenir au moins 10 caractères (requis par le schéma Astro).'
      - name: author
        label: Auteur
        widget: string
        default: Le Webmaster
      - name: tags
        label: Tags
        widget: list
        default: []
        field:
          name: tag
          label: Tag
          widget: string
      - name: cover
        label: Image de couverture
        widget: image
        required: false
      - name: coverAlt
        label: Texte alternatif de la couverture
        widget: string
        required: false
        hint: 'Décrivez l’image pour les lecteurs d’écran'
      - name: coverCaption
        label: Légende de la couverture
        widget: string
        required: false
      - name: draft
        label: Brouillon
        widget: boolean
        default: false
      - name: body
        label: Contenu
        widget: markdown
        hint: 'Pour insérer une image dans le texte, utilisez le bouton Image de la barre d’outils (médiathèque). L’image de couverture se met dans le champ dédié.'

  # Galerie de GIF : alimentée uniquement par l'administration.
  # Les médias passent par la médiathèque globale (`media_folder` ci-dessus) :
  # pas de media_folder de collection.
  - name: gallery
    label: Galerie
    label_singular: GIF
    description: 'Album de GIF du webmaster. Uploadez les fichiers via la médiathèque (champ Image) et évitez les fichiers lourds : un GIF de plus de 2 Mo ralentit la page.'
    folder: src/content/gallery
    create: true
    delete: true
    extension: md
    format: frontmatter
    # Champs alignés 1:1 sur le schéma `gallery` de src/content/config.ts.
    fields:
      - name: title
        label: Titre
        widget: string
        pattern:
          - '^.{2,}$'
          - 'Le titre doit contenir au moins 2 caractères (schéma Astro).'
      - name: date
        label: Date d’ajout
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
      - name: image
        label: Fichier GIF
        widget: image
        required: false
        hint: 'Uploadez le GIF via la médiathèque. Évitez les fichiers lourds (plus de 2 Mo) : préférez un GIF court et léger.'
      - name: externalUrl
        label: URL externe
        widget: string
        required: false
        hint: 'URL https d’un GIF externe, optionnel ; l’upload est préférable'
      - name: alt
        label: Texte alternatif
        widget: string
        required: true
        pattern:
          - '^.{3,}$'
          - 'Le texte alternatif doit contenir au moins 3 caractères (schéma Astro).'
        hint: 'Décrivez le GIF pour les lecteurs d’écran'
      - name: description
        label: Description
        widget: text
        required: false
      - name: credit
        label: Crédit
        widget: string
        required: false
      - name: tags
        label: Tags
        widget: list
        default: []
        field:
          name: tag
          label: Tag
          widget: string
